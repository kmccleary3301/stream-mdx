name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    environment: npm-publish
    runs-on: ubuntu-24.04
    # release:gates alone takes ~14 min locally (818.8 s on 2026-10-24); the full job must finish before publish.
    timeout-minutes: 75
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OIDC requires npm >=11.5.1 and Node >=22.14; never float across npm majors.
      - name: Install npm 11 (for trusted publishing)
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Determinism matrix (node vs browser worker)
        run: npm run determinism:matrix

      - name: HTML parity (server blocks renderer vs browser final DOM)
        run: npm run determinism:html-parity

      - name: Build docs site (static export)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run docs:build

      - name: Docs link integrity (internal routes + anchors)
        env:
          DOCS_CHECK_ANCHORS: "1"
        run: npm run docs:check-links

      - name: Pack + install smoke (Next + Vite)
        run: npm run ci:pack-smoke

      - name: Release gates (analyzer + regression + perf)
        env:
          # Per-scenario hang guard, not a perf budget. S1_slow_small paces 2272 sequential
          # append round trips (~35 s locally); Playwright tracing on hosted runners exceeded 60 s.
          STREAM_MDX_REGRESSION_TIMEOUT: "180000"
          # Style baselines are macOS-captured layout metrics; Ubuntu fonts and scrollbars differ.
          # The local release:gates run enforces them.
          STREAM_MDX_GATES_SKIP_STYLE_SNAPSHOTS: "1"
        run: npm run release:gates

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: npm run changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
