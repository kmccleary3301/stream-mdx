name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # OIDC requires npm >=11.5.1 and Node >=22.14; never float across npm majors.
      - name: Install npm 11 (for trusted publishing)
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Pack + install smoke (Next + Vite)
        run: npm run ci:pack-smoke

      - name: Release gates (analyzer + regression + perf)
        run: npm run release:gates

      - name: Publish (Changesets)
        run: npm run changeset:publish
