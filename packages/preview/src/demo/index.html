<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StreamMDX local preview</title>
    <style>
      :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
      body { max-width: 960px; margin: 32px auto; padding: 0 20px; }
      header, .controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .notice { color: #596579; }
      button { border: 0; border-radius: 8px; padding: 10px 14px; font: inherit; cursor: pointer; }
      #status { margin: 16px 0; min-height: 48px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, monospace; }
      #preview { overflow: hidden; border: 1px solid #94a3b8; border-radius: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Local project preview</h1>
        <p class="notice">This demo compiles locally in an opaque iframe. Update styles to preserve the counter, or update code to remount and reset it.</p>
      </div>
      <div class="controls">
        <button id="revise-styles" type="button">Update styles (keep state)</button>
        <button id="revise-code" type="button">Update code (reset state)</button>
      </div>
    </header>
    <div id="status" aria-live="polite">Starting local compiler…</div>
    <div id="preview"></div>
    <script type="module" src="/demo.js"></script>
  </body>
</html>
